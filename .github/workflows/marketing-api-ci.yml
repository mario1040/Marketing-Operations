name: Marketing API CI
# Re-run validation after resolving the Vite / esbuild peer dependency conflict.

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/postgres-persistence]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run lint
      - name: Build frontend
        run: npm run build
